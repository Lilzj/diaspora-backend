# ─────────────────────────────────────────────────────────────────────────────
# Diaspora API on Fly.io
#
# ── Why this deployment exists ───────────────────────────────────────────────
#
# Every runtime check in this programme has run against a `Diaspora.Api.exe` on
# `localhost:5099` backed by a user-owned PostgreSQL cluster living in a session
# scratchpad. That arrangement lost its database twice and its emulator twice,
# and each loss invalidated whatever was being measured at the time. A hosted API
# and a hosted database mean seeded data survives the session that created it.
#
# ── Region ───────────────────────────────────────────────────────────────────
#
# `iad` (Ashburn) sits next to the Neon project in AWS `us-east-2` (Ohio). Every
# request this API serves makes several database round trips, so the distance
# between the app and the database matters far more than the distance between the
# phone and the app.
#
# ── This is a test deployment, and it is public ──────────────────────────────
#
# Anyone who finds the hostname can reach it. It carries rate limiting and a real
# signing key, and every account in it is seeded and disposable. Nothing here
# should be data anybody would mind being exposed.
# ─────────────────────────────────────────────────────────────────────────────

app = 'diaspora-api'
primary_region = 'iad'

[build]
  dockerfile = 'docker/Dockerfile'

[env]
  # Production is what the module option validators expect. It also refuses to
  # log OTP codes — `IdentityModuleOptionsValidator` will not start any
  # non-Development environment with `LogOtpCodesForDevelopment` enabled — so
  # seeding here creates identities directly rather than reading codes from a
  # log, and signs in with a password.
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://+:8080'

  # ── This app runs on exactly one machine, and that is a correctness requirement ──
  #
  # Not a cost decision and not a default nobody revisited. Four parts of the platform assume
  # one copy of the process, and three of them fail by quietly doing something reasonable:
  #
  #   1. Rate limiting partitions in memory. Three machines enforce every budget three times
  #      over — sign-in at 30/min rather than 10, OTP at 15 per 5 min rather than 5 — and
  #      nothing logs that it happened.
  #   2. The timer-driven sweeps take an IDistributedLock whose shipped implementation
  #      coordinates within one process only. Three machines run every expiry, placement,
  #      withdrawal, campaign and recurring-donation sweep three times. Recurring donations
  #      are the one where running twice is a second charge.
  #   3. Real-time delivery has no backplane, so a notification reaches only the members
  #      attached to the machine that produced it.
  #   4. The outbox dispatcher is sized for one dispatcher (MaxConcurrency 1). Leases make
  #      concurrent dispatch safe, so this is the least fragile of the four.
  #
  # ── What this file can and cannot do about it ─────────────────────────────
  #
  # It can say so. It cannot enforce it. There is no fly.toml key that caps machine count:
  # `max_machines_running` is not a documented [http_service] key, and writing one would be a
  # line that looks like a cap and silently is not — the same shape of mistake as the
  # fdaa::/16 guess corrected under ForwardedHeaders above. Count is changed with
  # `fly scale count` or by cloning machines, and `fly deploy` preserves whatever the app was
  # scaled to rather than resetting it to this file.
  #
  # Note also that `min_machines_running` below is NOT a floor here: Fly documents it as
  # applying only when `auto_stop_machines` is "stop" or "suspend", and this app sets it to
  # false. It is kept because it becomes meaningful the moment autostop is turned on.
  #
  # So the enforcement is in the application. DeploymentTopologyValidator refuses to start a
  # host whose declared instance count exceeds what the platform can serve correctly, and this
  # value is that declaration.
  #
  # Be clear about the limit of that: scaling this app without changing the line below is NOT
  # caught by anything. The second machine boots, reads 1, and serves traffic while believing
  # it is alone. A process cannot count its own replicas, so the check validates a declaration
  # rather than a reality, and this comment is the only thing standing between an operator and
  # that gap. Raise this number in the same change that scales the app — at which point the
  # host refuses to start, which is the point.
  #
  # To actually scale: register a lock that spans instances (a Postgres advisory lock needs no
  # new infrastructure), add a distributed rate-limit store and a real-time backplane, then
  # raise this. In that order. See BARCH-002.
  Deployment__InstanceCount = '1'

  # ── Which upstream may set X-Forwarded-For ─────────────────────────────────
  #
  # Load-bearing, and the host will not start without it. Every per-IP rate limit partitions
  # on Connection.RemoteIpAddress and every SecurityEvent and UserSession records it, so who
  # may set that address is a security boundary. ASP.NET Core answers it the dangerous way by
  # default: with both allow-lists empty it skips the known-address check and applies whatever
  # the caller sent, which made every per-IP budget forgeable once per request and every
  # recorded client address attacker-controlled. TrustedProxyOptionsValidator now refuses to
  # boot a non-Development host that names no ingress, so this entry is what lets this
  # deployment start at all.
  #
  # ── Why a /12, and why not fdaa::/16 ───────────────────────────────────────
  #
  # Measured on this machine, not taken from documentation — Fly documents neither the proxy's
  # source address nor a range to trust. Reading /proc/net/tcp6 inside machine
  # 867615be4673d8 while traffic flowed: connections to :8080 arrive from 172.19.11.233, the
  # default gateway on eth0, which sits on 172.19.11.232/29. They arrive as IPv4-mapped IPv6
  # peers, which ForwardedHeadersMiddleware.CheckKnownAddress unwraps before testing.
  #
  # It is NOT a 6PN fdaa:: address. 6PN carries machine-to-machine traffic and SSH and
  # bypasses the proxy — Fly's own 6PN page says so. An fdaa::/16 allow-list is the obvious
  # guess, and an earlier draft of this fix made it; it would have matched nothing, and that
  # failure is quiet rather than loud: headers ignored, every member sharing one rate-limit
  # bucket. The audit finding's own remediation note had to be corrected for the same reason.
  #
  # A /12 rather than the measured /29 because the /29 is this machine on this host. A
  # reschedule moves it and a stale /29 fails the same quiet way. 172.16.0.0/12 is the private
  # range the machine's own interface lives on, is unroutable from the internet, and survives
  # the machine moving.
  #
  # The __0 is not decorative. Both lists bind as arrays, and configuration reads an array from
  # indexed child keys only, so a flat ForwardedHeaders__KnownIPNetworks has a value, no
  # children, and binds to an empty list — a fix that deploys green and changes nothing.
  # Measured on .NET 10.0.13. With the validator in place that mistake now refuses to boot.
  ForwardedHeaders__KnownIPNetworks__0 = '172.16.0.0/12'

  # ── Media needs somewhere it may write ─────────────────────────────────────
  #
  # `FilesystemStorageProvider` resolves a relative `FilesystemRoot` against
  # `AppContext.BaseDirectory` — `/app` — which the non-root `app` user cannot
  # write to. Every upload answered 500 from `Directory.CreateDirectory`, and
  # from outside that looks like a broken endpoint rather than a missing mount.
  #
  # A volume rather than a container path, because uploads should outlive a
  # deploy: a listing whose photograph vanishes on the next release is worse
  # than one that never had one.
  Media__Storage__FilesystemRoot = '/data/media'

  # ── And somewhere the client can reach it ────────────────────────────────
  #
  # Unset, `MediaUrlFactory` emits a bare `/api/v1/media/…` path. The mobile
  # client holds a base of `https://<host>/v1`, so joining the two gave
  # `/v1/api/v1/media/…` and every image 404'd — one of the three faults in
  # UAT-121.
  #
  # The factory now falls back to the request's own origin, so this is belt and
  # braces rather than the only defence. It is still set explicitly, because the
  # fallback cannot help a background worker composing a notification — there is
  # no request to read an origin from.
  #
  # The origin only. A path here would be prefixed onto routes that already
  # carry their own.
  Media__Storage__PublicBaseUrl = 'https://diaspora-api.fly.dev'

  # -- Who outbound mail is from --------------------------------------------
  #
  # Not a secret, so it lives here beside the other operational settings rather
  # than in the secret store. It is still *required*: EmailOptionsValidator
  # refuses a configuration with credentials and no sender address, because
  # Resend rejects a `from` on an unverified domain and its refusal names the
  # message rather than the configuration.
  #
  # `onboarding@resend.dev` is Resend's own test sender. It needs no domain
  # verification and delivers only to the address that owns the Resend account,
  # which is exactly the shape of a first end-to-end test. Point this at a
  # verified domain before real members depend on it.
  # diaspora.joinmydiaspora.com is the verified domain in Resend (the subdomain,, so mail reaches real members rather
  # not the apex - the apex is refused with a 403 naming it).
  Email__DefaultProvider = 'Resend'
  Email__From__Address = 'no-reply@diaspora.joinmydiaspora.com'
  Email__From__Name = 'Diaspora'

  # -- A different mailbox for a different kind of message ------------------
  #
  # Keyed by notification category. A receipt and a security alert arriving from
  # one address teaches members to filter both, and the one they then miss is the
  # one saying their account was suspended.
  #
  # Anything not listed falls back to From above, so this is the handful where it
  # earns its keep rather than an enumeration of every category.
  Email__Senders__security__Address = 'security@diaspora.joinmydiaspora.com'
  Email__Senders__security__Name = 'Diaspora Security'
  Email__Senders__billing__Address = 'receipts@diaspora.joinmydiaspora.com'
  Email__Senders__billing__Name = 'Diaspora Receipts'
  Email__Senders__platform__Address = 'hello@diaspora.joinmydiaspora.com'
  Email__Senders__platform__Name = 'Diaspora'

  # Turns a notification's in-app route into something clickable in an inbox.
  # Empty would simply drop the button, which is the right failure.
  Email__AppBaseUrl = 'https://diaspora-api.fly.dev'
  Email__UnsubscribeBaseUrl = 'https://diaspora-api.fly.dev/unsubscribe'

  # ── Payments ───────────────────────────────────────────────────────────────
  #
  # Non-secret settings only. The four credentials are Fly secrets, set out of
  # band and never in this file:
  #
  #   Payments__Stripe__SecretKey            sk_test_… / sk_live_…
  #   Payments__Stripe__WebhookSecret        whsec_…  (per endpoint, NOT the API key)
  #   Payments__Flutterwave__SecretKey       FLWSECK_TEST-… / FLWSECK-…
  #   Payments__Flutterwave__WebhookSecretHash
  #
  # Each adapter is a no-op until its own key is present, so a missing secret
  # leaves the capability honestly reported as absent rather than producing a
  # 401 on somebody's payment.
  #
  # Switching sandbox to live is a key change and nothing else: no code, no
  # routing change, no redeploy of this file. The one thing to re-check is the
  # payout matrix in appsettings.json, because a live account is approved for
  # corridors a test account is not.

  # Where Stripe returns a member after Checkout. Stripe rejects a custom
  # scheme, so these are API pages that hand off to diaspora:// on arrival.
  Payments__Stripe__CheckoutSuccessUrl = 'https://diaspora-api.fly.dev/payments/checkout/complete'
  Payments__Stripe__CheckoutCancelUrl = 'https://diaspora-api.fly.dev/payments/checkout/cancelled'

  # The names the payout capability matrix routes on. They must match what each
  # adapter reports as its own Provider, or a matrix row names an adapter nobody
  # registered and the router refuses with provider_not_registered.
  # Deposits are OFF unless this is set. FinancialOptions.EnableDeposits is a
  # plain bool with no initializer, so every top-up refuses with
  # financial.deposit.not_supported until a deployment turns it on. The limits
  # endpoint reports it honestly as isEnabled:false, and the client reads that.
  Financial__EnableDeposits = 'true'

  Payments__Stripe__Provider = 'stripe'
  Payments__Flutterwave__Provider = 'flutterwave'

  # -- The rewards checks (D-13) ---------------------------------------------
  #
  # Both default to off in code and waited on the privacy notice, which now
  # describes them (diaspora-app#10). Signals flag, staff decide: neither takes
  # anything from a member, they hold points or pause publishing for a person
  # to review.
  #
  # A device another account already registered holds the new account's points,
  # and a referral it joined through, for review. Only as good as the identifier
  # the app sends: one per installation since diaspora-app#10, so an older build
  # (a new id each launch) is almost never matched.
  Identity__EnableSharedDeviceSignal = 'true'

  # A fraud-like rejected verification together with upheld reports on three
  # pieces of content in a week makes a member High: points held, publishing
  # paused. TrustRiskSweep, which lets evidence age out, runs either way.
  Trust__EnableRiskAssessment = 'true'

  # -- Cash conversion (CNV-01) ----------------------------------------------
  #
  # Members turn vested points into wallet credit at the published
  # reward.conversion rate. Defaults to off in code, and stayed off until the
  # MUR rewards pot was funded, so the switch opens into a working state. An
  # empty pot pauses conversion; it can never overdraw. To stop it fast, set this
  # to 'false' and deploy the same image.
  Financial__EnableRewardConversion = 'true'

[http_service]
  internal_port = 8080
  force_https = true

  # ── Kept warm on purpose ───────────────────────────────────────────────────
  #
  # `auto_stop_machines` would suspend the machine when idle and cost 20–40
  # seconds on the next request. During a device walkthrough that is
  # indistinguishable from a hung screen, and this programme has already spent
  # two rounds separating broken tooling from broken product. One always-on
  # shared machine is worth more than the saving.
  auto_stop_machines = false
  auto_start_machines = true

  # Inert as written, and kept deliberately. Fly documents min_machines_running as applying
  # only when auto_stop_machines is "stop" or "suspend"; it is false above, so this sets no
  # floor today. It is also a floor and never a cap — see the single-instance note in [env],
  # which is where the constraint that matters is written down.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    # Liveness, not readiness: readiness also probes the database, and a machine
    # that is up but waiting on Neon to wake should not be killed and restarted.
    path = '/health/live'

[[mounts]]
  source = 'diaspora_media'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
