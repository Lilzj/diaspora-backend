name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-test:
    name: Release build, tests, vulnerability scan
    runs-on: ubuntu-latest
    # About 9 minutes reach the integration tests (restore, scan, Release build, unit,
    # architecture), and the integration suite takes about 15 more. At 20 the job was
    # cancelled 11 minutes into it. 45 leaves room for the API tests and a slow runner.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Diaspora.slnx

      # Separate from the build so a vulnerable dependency is reported as its own
      # failure rather than buried in a wall of TreatWarningsAsErrors output. The
      # Release build below also fails on advisories — this step just names them.
      - name: Vulnerability scan
        run: |
          dotnet list Diaspora.slnx package --vulnerable --include-transitive 2>&1 | tee audit.log
          if grep -q "has the following vulnerable packages" audit.log; then
            echo "::error::Vulnerable packages detected. See the log above."
            exit 1
          fi

      # Release is the gate: TreatWarningsAsErrors, NuGetAudit and the full analyzer
      # set are only active here. A green Debug build proves nothing.
      - name: Build (Release)
        run: dotnet build Diaspora.slnx -c Release --no-restore

      # BBL-006. The build writes contracts/Diaspora.Api.json -- the step above just did -- so a
      # dirty contracts/ here is a contract that was committed stale. It is the same guarantee the
      # migrations job gets from `ef migrations has-pending-model-changes`, pointed at the other
      # committed artefact.
      #
      # This matters because the file is read by a SECOND repository. The client's eleven
      # contract-drift suites compare their assumptions against it and describe.skip themselves
      # when the backend is not checked out beside them, which it is not in their static-and-unit
      # job -- so nothing downstream notices a stale document either. Those two halves are the
      # client's to fix; this half makes sure the document they would read is current.
      #
      # `git diff --exit-code` and not `git status`: on Windows a rebuild updates the file's mtime
      # and `status` reports it modified although the content is identical after the line-ending
      # filter. `diff` compares content and is the honest check.
      - name: Published contract is current
        run: |
          if ! git diff --exit-code -- contracts/; then
            echo "::error::contracts/Diaspora.Api.json is stale. The Release build above"
            echo "::error::regenerated it and the result differs from what was committed."
            echo "::error::Run 'dotnet build src/Diaspora.Api' and commit the diff: it is the"
            echo "::error::API surface changing, and the client repository reads this file."
            git --no-pager diff --stat -- contracts/
            exit 1
          fi

      # The analyzer pack's own tests, which CI did not run. Four of the five test projects were
      # listed here and this was the missing one, which matters in one direction only: a rule that
      # fires wrongly already reddens every build, because the pack's diagnostics are warnings and
      # warnings are errors. A rule that STOPS firing is invisible -- remove DSP4005's registration
      # and the Release build above stays green, while the only thing that objects is a suite
      # nothing ran. That is a guardrail whose proof was not wired to anything, which is the
      # complaint the pre-launch audit opened with.
      #
      # First among the suites because it takes seconds, and because it proves the rules the build
      # above was already relying on.
      - name: Analyzer tests
        run: >
          dotnet test tests/Diaspora.AnalyzerTests/Diaspora.AnalyzerTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=analyzer.trx"
          --results-directory ./test-results

      - name: Unit tests
        run: >
          dotnet test tests/Diaspora.UnitTests/Diaspora.UnitTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      - name: Architecture tests
        run: >
          dotnet test tests/Diaspora.ArchitectureTests/Diaspora.ArchitectureTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=architecture.trx"
          --results-directory ./test-results

      - name: Integration tests
        run: >
          dotnet test tests/Diaspora.IntegrationTests/Diaspora.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      - name: API tests
        run: >
          dotnet test tests/Diaspora.ApiTests/Diaspora.ApiTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=api.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          retention-days: 14

  migrations:
    name: Migration applies to PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The integration suite runs on SQLite for speed, which means the PostgreSQL
    # migration is never executed by it. This job is the only thing standing between
    # a model/migration drift and a failed production deploy.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: diaspora_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The EF tools read the projects' metadata before they build anything, and that
      # needs obj/project.assets.json. On a fresh runner nothing has restored, so the
      # first `dotnet ef` failed in seconds — "Assets file … not found. Run a NuGet
      # package restore" — before a single migration ran. The build job restores; this
      # one never did.
      - name: Restore
        run: dotnet restore Diaspora.slnx

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Apply migrations
        env:
          DIASPORA_MIGRATIONS_CONNECTION: Host=localhost;Port=5432;Database=diaspora_ci;Username=postgres;Password=postgres
        run: >
          dotnet ef database update
          --project src/Diaspora.Persistence
          --startup-project src/Diaspora.Api

      # A second run must be a no-op. If it is not, the migration is not idempotent
      # and a re-deploy against an already-migrated database will fail.
      - name: Re-apply migrations (must be a no-op)
        env:
          DIASPORA_MIGRATIONS_CONNECTION: Host=localhost;Port=5432;Database=diaspora_ci;Username=postgres;Password=postgres
        run: >
          dotnet ef database update
          --project src/Diaspora.Persistence
          --startup-project src/Diaspora.Api

      # --startup-project must be the API host, not Persistence. Module entity
      # configurations are contributed at runtime through IDatabaseContributor and found
      # by scanning the dependency context; Persistence references no module, so a model
      # built from it contains Identity's tables and nothing else. Pointed at itself this
      # step compared an Identity-only model against the full snapshot and reported drift
      # that did not exist — a false failure since the first module migration in B3, and
      # corrected in B3.0.2. DesignTimeDbContextFactory documents the same requirement.
      - name: Check for un-scaffolded model changes
        env:
          DIASPORA_MIGRATIONS_CONNECTION: Host=localhost;Port=5432;Database=diaspora_ci;Username=postgres;Password=postgres
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Diaspora.Persistence \
            --startup-project src/Diaspora.Api \
          && echo "Model and migrations are in sync."

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t diaspora-api:ci .
